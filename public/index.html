<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Keep this page out of search engines. -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Don't leak the query string (appointment/contact IDs, customer name) to the logo host or any other request. -->
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Appointment approval</title>

  <style>
    /* =================================================================
       Design tokens. Brand colors come from the CONFIG block in the
       script below; the values here are fallbacks.
       ================================================================= */
    :root {
      --brand: #1f4e79;
      --accent: #2563eb;

      --bg: #f3f4f6;
      --surface: #ffffff;
      --surface-2: #f8f9fb;
      --border: #e5e7eb;
      --text: #111827;
      --text-2: #374151;
      --muted: #6b7280;

      --brand-tint: #eef2f7;  /* replaced by color-mix below where supported */

      --ok: #15803d;          /* white text on this: 5.0:1 */
      --ok-hover: #166534;
      --ok-soft: #dcfce7;
      --danger: #b91c1c;      /* 6.5:1 on white */
      --danger-line: #e8a1a1;
      --danger-soft: #fef2f2;
      --warn: #b45309;
      --warn-soft: #fef3c7;

      --radius-lg: 20px;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(17, 24, 39, .04), 0 12px 32px -12px rgba(17, 24, 39, .14);
    }
    @supports (color: color-mix(in srgb, red, blue)) {
      :root { --brand-tint: color-mix(in srgb, var(--brand) 9%, var(--surface)); }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0f13;
        --surface: #161a20;
        --surface-2: #1c2128;
        --border: #2a303a;
        --text: #f3f4f6;
        --text-2: #d1d5db;
        --muted: #9ca3af;
        --brand-tint: #1d2633;
        --ok-soft: #12321f;
        --danger: #f87171;
        --danger-line: #7f2d2d;
        --danger-soft: #2a1617;
        --warn: #fbbf24;
        --warn-soft: #33270f;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px -16px rgba(0, 0, 0, .6);
      }
      @supports (color: color-mix(in srgb, red, blue)) {
        :root { --brand-tint: color-mix(in srgb, var(--brand) 22%, var(--surface)); }
      }
    }

    /* ================================================================= */

    * { box-sizing: border-box; }
    html, body { margin: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      margin: 4px 2px 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand img {
      display: block;
      max-height: 32px;
      max-width: 150px;
      object-fit: contain;
    }
    .brand-name {
      font-weight: 650;
      font-size: .9375rem;
      letter-spacing: -.005em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .secure {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: .75rem;
      font-weight: 600;
    }
    .secure .ic { width: 13px; height: 13px; }

    /* ---------- Card ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .section { padding: 20px; }
    .section + .section { border-top: 1px solid var(--border); }
    @media (min-width: 420px) {
      .section { padding: 22px 24px; }
    }

    .ic {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- Request header ---------- */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px 4px 9px;
      border-radius: 999px;
      font-size: .8125rem;
      font-weight: 600;
      background: var(--warn-soft);
      color: var(--warn);
    }
    .pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }
    h1 {
      margin: 12px 0 4px;
      font-size: 1.375rem;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -.015em;
    }
    h1:focus, h2:focus, p:focus { outline: none; } /* focused programmatically only */
    .lede { margin: 0; color: var(--muted); font-size: .9375rem; }

    /* ---------- "When" panel ---------- */
    .when {
      margin-top: 18px;
      padding: 16px;
      border-radius: var(--radius);
      background: var(--brand-tint);
    }
    .when-main {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .when-main .ic { color: var(--brand); margin-top: 2px; }
    .when-date {
      font-size: 1.0625rem;
      font-weight: 650;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .when-time {
      color: var(--text-2);
      font-weight: 500;
      overflow-wrap: anywhere;
    }
    .when-service {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(127, 127, 127, .18);
      color: var(--text-2);
      font-weight: 500;
      overflow-wrap: anywhere;
    }
    .when-service .ic { color: var(--brand); }

    /* ---------- Customer + extra details ---------- */
    .label {
      margin: 0 0 10px;
      font-size: .75rem;
      font-weight: 650;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .person {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: var(--brand-tint);
      color: var(--brand);
      font-weight: 700;
      font-size: .9375rem;
      letter-spacing: .02em;
    }
    @media (prefers-color-scheme: dark) { .avatar, .when-main .ic, .when-service .ic { color: var(--text); } }
    .person-name { font-weight: 650; overflow-wrap: anywhere; }
    .person-phone {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      color: var(--text-2);
      text-decoration: none;
      font-size: .9375rem;
      border-radius: 6px;
    }
    .person-phone .ic { width: 15px; height: 15px; color: var(--muted); }
    .person-phone:hover { text-decoration: underline; }
    .person-phone:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .meta { margin: 16px 0 0; display: grid; gap: 14px; }
    .meta-row { display: flex; gap: 12px; align-items: flex-start; }
    .meta-row .ic { color: var(--muted); margin-top: 1px; width: 18px; height: 18px; }
    .meta dt { font-size: .8125rem; color: var(--muted); }
    .meta dd {
      margin: 0;
      color: var(--text);
      white-space: pre-line; /* keep line breaks in notes */
      overflow-wrap: anywhere;
    }

    /* ---------- Buttons ---------- */
    .actions { display: grid; gap: 10px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 52px;
      padding: 12px 18px;
      border-radius: var(--radius);
      border: 1.5px solid transparent;
      font: inherit;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: -.005em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background-color .15s, border-color .15s, color .15s, transform .05s;
    }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .btn:disabled { cursor: not-allowed; opacity: .55; }
    .btn[aria-busy="true"] { opacity: 1; cursor: progress; }
    .btn .ic { width: 18px; height: 18px; stroke-width: 2.4; }

    .btn-approve { background: var(--ok); color: #fff; box-shadow: 0 1px 2px rgba(21, 128, 61, .25); }
    .btn-approve:hover:not(:disabled) { background: var(--ok-hover); }

    .btn-reject { background: transparent; color: var(--danger); border-color: var(--danger-line); }
    .btn-reject:hover:not(:disabled) { background: var(--danger-soft); border-color: var(--danger); }
    .btn-reject.solid { background: #b91c1c; border-color: #b91c1c; color: #fff; }
    .btn-reject.solid:hover:not(:disabled) { background: #991b1b; border-color: #991b1b; }

    .btn-ghost { background: transparent; color: var(--text-2); border-color: var(--border); }
    .btn-ghost:hover:not(:disabled) { background: var(--surface-2); }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

    /* ---------- Reject step ---------- */
    .reject-step h2 {
      margin: 0 0 4px;
      font-size: 1.0625rem;
      font-weight: 700;
    }
    .reject-step .lede { margin-bottom: 16px; }

    /* ---------- Status + error ---------- */
    .status:empty { display: none; }
    .status {
      margin: 12px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: .875rem;
    }
    .error-box {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      padding: 14px;
      border-radius: var(--radius);
      background: var(--danger-soft);
      border: 1px solid var(--danger-line);
      color: var(--text);
    }
    .error-box > .ic { color: var(--danger); margin-top: 1px; }
    .error-box p { margin: 0; font-size: .9375rem; }
    .error-box .btn { margin-top: 12px; min-height: 44px; width: auto; padding: 8px 16px; font-size: .9375rem; }

    /* ---------- Result + invalid states ---------- */
    .state { padding: 36px 24px 28px; text-align: center; }
    .state-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .state-icon .ic { width: 30px; height: 30px; stroke-width: 2.4; }
    .state-icon.ok   { background: var(--ok-soft); color: var(--ok); box-shadow: 0 0 0 8px color-mix(in srgb, var(--ok-soft) 45%, transparent); }
    .state-icon.no   { background: var(--danger-soft); color: var(--danger); box-shadow: 0 0 0 8px color-mix(in srgb, var(--danger-soft) 45%, transparent); }
    .state-icon.warn { background: var(--warn-soft); color: var(--warn); box-shadow: 0 0 0 8px color-mix(in srgb, var(--warn-soft) 45%, transparent); }
    @media (prefers-color-scheme: dark) { .state-icon.ok { color: #4ade80; } }
    .state h1 { margin-top: 0; }
    .state > p { margin: 0 auto; max-width: 34ch; color: var(--muted); }

    .recap {
      margin: 22px 0 0;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--surface-2);
      border: 1px solid var(--border);
      text-align: left;
    }
    .recap-title { font-weight: 650; overflow-wrap: anywhere; }
    .recap-sub { color: var(--muted); font-size: .9375rem; overflow-wrap: anywhere; white-space: pre-line; }
    .fine { margin: 18px auto 0 !important; font-size: .8125rem; color: var(--muted); }

    .foot {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: .8125rem;
      text-align: center;
    }
    .foot .ic { width: 14px; height: 14px; }

    /* Loading + "try again" on the message view */
    .state-icon.loading { background: var(--surface-2); color: var(--muted); }
    .state-icon.loading .spinner { width: 26px; height: 26px; border-width: 3px; }
    .retry-load { width: auto; margin-top: 18px; padding: 10px 22px; min-height: 44px; }
    #viewMessage > p:empty { display: none; }

    [hidden] { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <!-- Icon sprite (simple line icons). Used via <svg><use href="#i-..."/></svg>. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M21 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 1.1 4.2 2 2 0 0 1 3.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L7 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5M12 16.5h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5.5M12 7.5h.01"/></symbol>
  </svg>

  <div class="page">

    <!-- Logo / business name, and a "Staff only" badge -->
    <header class="topbar">
      <div class="brand" id="brand">
        <img id="brandLogo" alt="" hidden>
        <span class="brand-name" id="brandName">Staff portal</span>
      </div>
      <span class="secure"><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg>Staff only</span>
    </header>

    <main class="card">

      <!-- Loading / invalid link / not found / load error -->
      <section id="viewMessage" class="state" aria-live="polite">
        <div class="state-icon loading" id="msgIcon" aria-hidden="true"><span class="spinner"></span></div>
        <h1 id="msgTitle">Loading appointment&hellip;</h1>
        <p id="msgText"></p>
        <button type="button" class="btn btn-ghost retry-load" id="reloadBtn" hidden>Try again</button>
      </section>

      <!-- The request to review -->
      <div id="viewRequest" hidden>
        <section class="section">
          <span class="pill"><span class="dot" aria-hidden="true"></span>Awaiting approval</span>
          <h1>Appointment request</h1>
          <p class="lede">Review the details, then approve or reject.</p>

          <div class="when">
            <div class="when-main">
              <svg class="ic" aria-hidden="true"><use href="#i-calendar"/></svg>
              <div>
                <div class="when-date" id="whenDate"></div>
                <div class="when-time" id="whenTime"></div>
              </div>
            </div>
            <div class="when-service" id="whenService" hidden>
              <svg class="ic" aria-hidden="true"><use href="#i-sparkle"/></svg>
              <span id="whenServiceText"></span>
            </div>
          </div>
        </section>

        <section class="section">
          <p class="label">Customer</p>
          <div class="person">
            <div class="avatar" id="avatar" aria-hidden="true"></div>
            <div>
              <div class="person-name" id="personName"></div>
              <a class="person-phone" id="personPhone" hidden>
                <svg class="ic" aria-hidden="true"><use href="#i-phone"/></svg><span></span>
              </a>
            </div>
          </div>
          <dl class="meta" id="notesRow" hidden>
            <div class="meta-row">
              <svg class="ic" aria-hidden="true"><use href="#i-note"/></svg>
              <div><dt>Customer notes</dt><dd id="notesText"></dd></div>
            </div>
          </dl>
        </section>

        <section class="section">
          <!-- Error with Retry. role="alert" makes screen readers announce it. -->
          <div class="error-box" id="errorBox" role="alert" hidden>
            <svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg>
            <div>
              <p id="errorText" tabindex="-1"></p>
              <button type="button" class="btn btn-ghost" id="retryBtn">Retry</button>
            </div>
          </div>

          <div class="actions" id="actions">
            <button type="button" class="btn btn-approve" id="approveBtn">
              <svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span>Approve</span>
            </button>
            <button type="button" class="btn btn-reject" id="rejectBtn">
              <svg class="ic" aria-hidden="true"><use href="#i-x"/></svg><span>Reject</span>
            </button>
          </div>

          <!-- Inline confirmation step, so a booking isn't rejected by accident -->
          <div class="reject-step" id="rejectStep" hidden>
            <h2 id="rejectHeading" tabindex="-1">Reject this appointment?</h2>
            <p class="lede">The appointment will be cancelled in GHL.</p>
            <div class="actions">
              <button type="button" class="btn btn-reject solid" id="confirmRejectBtn">Confirm rejection</button>
              <button type="button" class="btn btn-ghost" id="cancelRejectBtn">Go back</button>
            </div>
          </div>

          <p class="status" id="status" aria-live="polite"></p>
        </section>
      </div>

      <!-- Final result (after a decision, or when the appointment was already decided) -->
      <section id="viewResult" class="state" hidden>
        <div class="state-icon" id="resultIcon" aria-hidden="true"><svg class="ic"><use id="resultIconUse" href="#i-check"/></svg></div>
        <h1 id="resultTitle" tabindex="-1"></h1>
        <p id="resultText"></p>
        <div class="recap" id="resultRecap" hidden>
          <div class="recap-title" id="recapTitle"></div>
          <div class="recap-sub" id="recapSub"></div>
        </div>
      </section>

      <noscript>
        <section class="state"><p>This page needs JavaScript. Please enable it, or update the appointment in GHL.</p></section>
      </noscript>
    </main>

    <p class="foot"><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg><span id="footText">Private staff link. Please don't forward it.</span></p>
  </div>

  <script>
  (function () {
    "use strict";

    /* =================================================================
       CONFIGURATION - edit these values before going live.
       ================================================================= */

    // Shown at the top of the page. Leave the placeholder or "" to show "Staff portal".
    const BUSINESS_NAME = "[BUSINESS NAME]";

    // Full https:// URL to your logo. Leave "" to skip the logo.
    const LOGO_URL = "";

    // Brand colors as hex. Primary = date panel, avatar and icons;
    // accent = keyboard focus ring. Approve/Reject stay green/red on purpose.
    const BRAND_PRIMARY = "#1f4e79";
    const BRAND_ACCENT  = "#2563eb";

    // Server function (api/decision.js). It holds the GHL token - never put
    // the token in this file, because anyone with a link can read the source.
    // Full address, so the page also works when opened from a file or embedded
    // in GHL (the function allows other origins via CORS).
    const API_URL = "https://appointmentpage-sand.vercel.app/api/decision";

    // How long to wait for the server before showing an error.
    const REQUEST_TIMEOUT_MS = 20000;

    /* ================================================================= */


    // ---------- Helpers ----------

    const $ = (id) => document.getElementById(id);
    const show = (el) => { el.hidden = false; };
    const hide = (el) => { el.hidden = true; };

    // textContent never interprets HTML, so data can't inject markup or scripts.
    const setText = (el, value) => { el.textContent = value; };

    const isUnset = (v) => !v || /^\[.*\]$/.test(v.trim());

    // Read a query-string parameter. Values GHL couldn't fill ("{{...}}") count as missing.
    const params = new URLSearchParams(window.location.search);
    function param(name) {
      const raw = (params.get(name) || "").trim();
      return raw.includes("{{") ? "" : raw;
    }


    // ---------- Branding ----------

    (function applyBranding() {
      const hex = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
      if (hex.test(BRAND_PRIMARY)) document.documentElement.style.setProperty("--brand", BRAND_PRIMARY);
      if (hex.test(BRAND_ACCENT))  document.documentElement.style.setProperty("--accent", BRAND_ACCENT);

      const hasName = !isUnset(BUSINESS_NAME);
      if (hasName) {
        setText($("brandName"), BUSINESS_NAME);
        setText($("footText"), "Private link for " + BUSINESS_NAME + " staff. Please don't forward it.");
        document.title = "Appointment approval · " + BUSINESS_NAME;
      }
      if (!isUnset(LOGO_URL)) {
        const img = $("brandLogo");
        img.alt = hasName ? BUSINESS_NAME : "Logo";
        img.addEventListener("error", () => { hide(img); $("brandName").classList.remove("sr-only"); });
        img.src = LOGO_URL;
        show(img);
        $("brandName").classList.add("sr-only"); // the logo already names the business
      }
    })();


    // ---------- Link parameters ----------
    // Link format: ?appointmentId=<Service Menu booking ID>
    // Everything shown on the page is loaded from GHL, not taken from the link.

    const bookingId = param("appointmentId");

    let details = null; // appointment details loaded from GHL


    // ---------- Server calls ----------

    class HttpError extends Error {
      constructor(status, data) {
        super("HTTP " + status);
        this.name = "HttpError";
        this.status = status;
        this.data = data || {};
      }
    }

    // fetch() with a timeout; resolves with the JSON body or throws.
    async function call(url, options) {
      if (navigator.onLine === false) {
        const e = new Error("offline"); e.name = "OfflineError"; throw e;
      }
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
      try {
        const res = await fetch(url, Object.assign({ cache: "no-store" }, options, { signal: controller.signal }));
        let data = {};
        try { data = await res.json(); } catch (e) { /* non-JSON reply */ }
        if (!res.ok || !data.ok) throw new HttpError(res.status, data);
        return data;
      } finally {
        clearTimeout(timer);
      }
    }

    // Returns { text, retry }. retry=false when trying again can't help.
    function describeError(err) {
      const name = err && err.name;
      if (name === "OfflineError") return { retry: true, text: "You appear to be offline. Check your connection, then try again." };
      if (name === "AbortError")   return { retry: true, text: "The server took too long to respond. Please try again." };
      if (name === "HttpError") {
        if (err.status === 403) return { retry: false, text: "This link isn't valid for this appointment. Please open the appointment in GHL." };
        if (err.status === 404) return { retry: false, text: "This appointment wasn't found in GHL. It may have been deleted." };
        if (err.status === 400) return { retry: false, text: "This link is incomplete. Please open the appointment in GHL." };
        const d = err.data || {};
        const why = d.ghlMessage ? " GHL said: “" + d.ghlMessage + "”" + (d.ghlStatus ? " (" + d.ghlStatus + ")" : "") + "." : "";
        return { retry: true, text: "Something went wrong in GHL (error " + err.status + ")." + why + " Please try again." };
      }
      return { retry: true, text: "We couldn't reach the server. Check your connection, then try again." };
    }


    // ---------- Views ----------

    function makeIcon(iconId) {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("class", "ic");
      const use = document.createElementNS(ns, "use");
      use.setAttribute("href", "#" + iconId);
      svg.appendChild(use);
      return svg;
    }

    // Loading spinner, or a warning with an optional "Try again" button.
    function showMessage(kind, title, text, canRetry) {
      hide($("viewRequest"));
      hide($("viewResult"));
      const icon = $("msgIcon");
      icon.className = "state-icon " + kind;
      if (kind === "loading") {
        const spin = document.createElement("span");
        spin.className = "spinner";
        icon.replaceChildren(spin);
      } else {
        icon.replaceChildren(makeIcon("i-alert"));
      }
      setText($("msgTitle"), title);
      setText($("msgText"), text || "");
      $("reloadBtn").hidden = !canRetry;
      show($("viewMessage"));
    }

    function initials(name) {
      const parts = name.split(/\s+/).filter(Boolean);
      return ((parts[0] || "")[0] || "") + (parts.length > 1 ? parts[parts.length - 1][0] : "");
    }

    function showRequest(d) {
      setText($("whenDate"), d.date || "");
      setText($("whenTime"), d.time || "");
      if (d.service) { setText($("whenServiceText"), d.service); show($("whenService")); }

      setText($("personName"), d.customerName || "Customer");
      setText($("avatar"), initials(d.customerName || "?").toUpperCase());
      if (d.phone) {
        const a = $("personPhone");
        a.href = "tel:" + d.phone.replace(/[^\d+]/g, ""); // only digits and "+" in the href
        setText(a.querySelector("span"), d.phone);
        show(a);
      }
      if (d.notes) { setText($("notesText"), d.notes); show($("notesRow")); }

      hide($("viewMessage"));
      show($("viewRequest"));
    }

    // kind: "approved" | "rejected" (just decided here), or the GHL status
    // ("confirmed", "cancelled", ...) when it had already been decided.
    function showResult(kind, justDecided) {
      hide($("viewMessage"));
      hide($("viewRequest"));

      const ok = kind === "approved" || kind === "confirmed";
      const no = kind === "rejected" || kind === "cancelled";
      $("resultIcon").className = "state-icon " + (ok ? "ok" : no ? "no" : "warn");
      $("resultIconUse").setAttribute("href", ok ? "#i-check" : no ? "#i-x" : "#i-info");

      let title, text;
      if (justDecided) {
        title = ok ? "Appointment approved" : "Appointment rejected";
        text = ok ? "The customer will be notified." : "The appointment has been cancelled.";
      } else if (ok || no) {
        title = ok ? "Already confirmed" : "Already cancelled";
        text = "This appointment was already " + (ok ? "confirmed" : "cancelled") + ". No action needed.";
      } else {
        title = "Already handled";
        text = "This appointment is no longer pending" + (kind ? " (status: " + kind + ")" : "") + ". No action needed.";
      }
      setText($("resultTitle"), title);
      setText($("resultText"), text);

      if (details) {
        setText($("recapTitle"), details.customerName || "");
        setText($("recapSub"), [details.service, [details.date, details.time].filter(Boolean).join(" · ")].filter(Boolean).join("\n"));
        show($("resultRecap"));
      }

      show($("viewResult"));
      if (justDecided) $("resultTitle").focus(); // announce the result to screen readers
    }


    // ---------- Load the appointment from GHL ----------

    async function load() {
      showMessage("loading", "Loading appointment…", "", false);
      try {
        const qs = new URLSearchParams({ appointmentId: bookingId });
        details = await call(API_URL + "?" + qs.toString(), { method: "GET" });

        // Already decided (by another staff member, or earlier) -> final state, no buttons.
        if (!details.pending) showResult(details.status, false);
        else showRequest(details);
      } catch (err) {
        const e = describeError(err);
        showMessage("warn", e.retry ? "Couldn't load the appointment" : "Invalid link", e.text, e.retry);
      }
    }


    // ---------- Approve / Reject ----------

    const approveBtn       = $("approveBtn");
    const rejectBtn        = $("rejectBtn");
    const confirmRejectBtn = $("confirmRejectBtn");
    const cancelRejectBtn  = $("cancelRejectBtn");
    const retryBtn         = $("retryBtn");
    const statusEl         = $("status");

    let sending = false;    // blocks double clicks while a request is in flight
    let lastAttempt = null; // { action, button } for Retry

    // Disable everything while sending and show a spinner in the clicked button.
    function setBusy(button, busy, busyLabel) {
      [approveBtn, rejectBtn, confirmRejectBtn, cancelRejectBtn, retryBtn].forEach((el) => { el.disabled = busy; });
      if (busy) {
        button._original = Array.from(button.childNodes);
        const spin = document.createElement("span");
        spin.className = "spinner";
        spin.setAttribute("aria-hidden", "true");
        button.replaceChildren(spin, document.createTextNode(busyLabel));
        button.setAttribute("aria-busy", "true");
      } else if (button._original) {
        button.replaceChildren.apply(button, button._original);
        button.removeAttribute("aria-busy");
      }
    }

    async function submit(action, button) {
      if (sending) return;
      sending = true;
      lastAttempt = { action: action, button: button };

      hide($("errorBox"));
      setText(statusEl, "Updating GHL…");
      setBusy(button, true, action === "approved" ? "Approving…" : "Rejecting…");

      try {
        await call(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ appointmentId: bookingId, action: action })
        });
        setText(statusEl, "");
        showResult(action, true); // buttons are gone from here on
      } catch (err) {
        // 409 = no longer pending (another staff member got there first). Not an error.
        if (err.name === "HttpError" && err.status === 409) {
          setText(statusEl, "");
          showResult(String(err.data.currentStatus || ""), false);
          return;
        }
        // Never show success on failure. Re-enable buttons and explain.
        setBusy(button, false);
        setText(statusEl, "");
        const e = describeError(err);
        setText($("errorText"), e.text);
        retryBtn.hidden = !e.retry;
        show($("errorBox"));
        (e.retry ? retryBtn : $("errorText")).focus();
      } finally {
        sending = false;
      }
    }

    approveBtn.addEventListener("click", () => submit("approved", approveBtn));

    rejectBtn.addEventListener("click", () => {
      hide($("errorBox"));
      hide($("actions"));
      show($("rejectStep"));
      $("rejectHeading").focus();
    });

    cancelRejectBtn.addEventListener("click", () => {
      hide($("errorBox"));
      hide($("rejectStep"));
      show($("actions"));
      rejectBtn.focus();
    });

    confirmRejectBtn.addEventListener("click", () => submit("rejected", confirmRejectBtn));

    retryBtn.addEventListener("click", () => {
      if (lastAttempt) submit(lastAttempt.action, lastAttempt.button);
    });

    $("reloadBtn").addEventListener("click", load);


    // ---------- Start ----------

    if (!bookingId) {
      showMessage("warn", "Invalid link", "This link is invalid. Please open the appointment in GHL.", false);
    } else {
      load();
    }
  })();
  </script>
</body>
</html>
